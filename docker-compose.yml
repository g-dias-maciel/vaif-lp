version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: tattoo-lp-php
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=tattoo_lp
      - DB_USER=tattoo_user
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_HOST=smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=noreply@tattoo-lp.com
    volumes:
      - ./public:/app/public
      - ./src:/app/src
    depends_on:
      - mysql
    networks:
      - tattoo-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: tattoo-lp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootSecure123!@#
      MYSQL_DATABASE: tattoo_lp
      MYSQL_USER: tattoo_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tattoo-network
    restart: unless-stopped

networks:
  tattoo-network:
    driver: bridge

volumes:
  mysql_data:
