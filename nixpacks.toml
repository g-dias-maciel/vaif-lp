# Nixpacks Configuration for Tattoo LP PHP
# This file tells Nixpacks how to build and run the application

[build]
# Specify PHP version
php = "8.2"

# Install system dependencies
apt = ["apache2", "libapache2-mod-php8.2", "php8.2-mysql", "php8.2-pdo"]

[phases.install]
# No composer dependencies needed for this project
cmds = []

[phases.build]
# Create .htaccess for URL rewriting
cmds = [
  "mkdir -p /app/public",
  "echo '<IfModule mod_rewrite.c>' > /app/public/.htaccess",
  "echo '    RewriteEngine On' >> /app/public/.htaccess",
  "echo '    RewriteBase /' >> /app/public/.htaccess",
  "echo '    RewriteCond %{REQUEST_FILENAME} !-f' >> /app/public/.htaccess",
  "echo '    RewriteCond %{REQUEST_FILENAME} !-d' >> /app/public/.htaccess",
  "echo '    RewriteRule ^(.*)$ index.php?path=$1 [QSA,L]' >> /app/public/.htaccess",
  "echo '</IfModule>' >> /app/public/.htaccess"
]

[start]
# Start Apache in foreground
cmd = "apache2ctl -D FOREGROUND"

[env]
# Set Apache document root
APACHE_DOCUMENT_ROOT = "/app/public"
